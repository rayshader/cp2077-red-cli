name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            binary_name: red-cli
          - os: macos-latest
            os_name: macos
            binary_name: red-cli
          - os: windows-latest
            os_name: windows
            binary_name: red-cli.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1

      - name: Define archive name as "red-cli-X.Y.Z-os"
        shell: bash
        run: echo "ARCHIVE_NAME=red-cli-${GITHUB_REF_NAME#v}-${{ matrix.os_name }}" >> $GITHUB_ENV

      - name: Setup project
        run: dart pub get

      - name: Build binary
        run: dart compile exe bin/main.dart -o ${{ matrix.binary_name }}

      - name: Create archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "$ARCHIVE_NAME.zip" "${{ matrix.binary_name }}" LICENSE README.md
          else
            zip "$ARCHIVE_NAME.zip" "${{ matrix.binary_name }}" LICENSE README.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: red-cli-*
          merge-multiple: true
          path: .

      - name: Extract CHANGELOG
        id: changelog
        uses: release-flow/keep-a-changelog-action@v3
        with:
          command: query
          version: latest

      - uses: softprops/action-gh-release@v1
        name: Create release
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.release-notes }}
          files: red-cli-*.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
